{id:'city',name:'Coastal City & Harbour',cat:'Urban',date:'12 Mar 2026',res:'0.5 m',svg:city.s,desc:['A coastal city: dense buildings in the west, a park in the middle, a harbour with ships and open sea in the east.','This looks like a seaside town. Houses and offices are on the left, a green park in the middle and boats near the water on the right.'],

{id:'flood',name:'River Flood Event',cat:'Disaster',date:'18 Nov 2025',res:'1 m',svg:flood.s,desc:['A river has overflowed its banks. A large part of the lowland is flooded, and some buildings sit on higher ground.','The river has spilled onto the land. Most of the blue area is water that shouldn’t be there, so some houses are in danger.'],

function Auth(m){const su=m=='signup';return`<div class="auth">${logo}<div class="card" style="margin-top:18px"><h2>${su?'Create your account':'Welcome back'}</h2><p class="mu">${su?'Start asking questions in under a minute.':'Log in to continue.'}</p><form data-f="${m}" novalidate>${su?'<div><label>Full name</label><input class="inp" name="n" placeholder="Asha Kumar"><div class="err" data-e="n"></div></div>':''}<div><label>Email</label><input class="inp" name="e" type="email" placeholder="you@example.com"><div class="err" data-e="e"></div></div><div><label>Password</label><input class="inp" name="p" type="password" placeholder="At least 6 characters"><div class="err" data-e="p"></div></div><button class="btn">${su?'Sign up':'Log in'}</button><button type="button" class="btn g" data-a="demo">Continue as demo user</button></form><p class="mu" style="margin:14px 0 0">${su?'Have an account? <a href="#login" style="color:var(--pr)">Log in</a>':'New here? <a href="#signup" style="color:var(--pr)">Sign up</a>'} · Demo only, nothing is stored on a server.</p></div></div>`}
const NAV=[['dash','home','Home'],['ask','chat','Ask'],['scenes','img','Scenes'],['saved','mark','Saved'],['learn','book','Learn']];
function Shell(v,body){return`<div class="app"><aside class="side">${logo}<div style="height:14px" class="sp"></div>${NAV.map(n=>`<a href="#app/${n[0]}" class="${v==n[0]?'on':''}">${ic(n[1])}<span>${n[2]}</span></a>`).join('')}<div style="flex:1" class="sp"></div><button class="nv" data-a="theme">${ic(S.dark?'sun':'moon')}<span>Theme</span></button><button class="nv" data-a="logout">${ic('out')}<span>Log out</span></button></aside><main class="main">${body}</main></div>`}
function Dash(){const f=SC[0];return`<div class="bar"><div><h2>Hello, ${esc((S.user.name||'there').split(' ')[0])} 👋</h2><p class="mu" style="margin:4px 0 0">What would you like to know about Earth today?</p></div><a class="btn" href="#app/ask">${ic('chat')}New question</a></div>
<div class="grid g4"><div class="card stat"><span class="mu">Questions asked</span><b>${S.q}</b></div><div class="card stat"><span class="mu">Saved answers</span><b>${S.saved.length}</b></div><div class="card stat"><span class="mu">Sample scenes</span><b>${SC.length}</b></div><div class="card stat"><span class="mu">Mode</span><b style="font-size:22px;padding-top:6px">${A.mode=='simple'?'Beginner':'Expert'}</b></div></div>
<h3 style="margin:24px 0 12px">Start with a scene</h3><div class="grid g3">${SC.slice(0,3).map(sceneCard).join('')}</div>
<h3 style="margin:24px 0 12px">Recent questions</h3><div class="card">${S.hist.length?S.hist.slice(0,5).map(h=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)"><span>${esc(h.q)}</span><span class="tag">${esc(sc(h.s).name)}</span></div>`).join(''):'<div class="empty">No questions yet. Try asking one!</div>'}</div>`}
const sceneCard=s=>`<button class="card sc" data-a="scene" data-id="${s.id}" style="font:inherit;color:inherit">${view(s)}<div class="b"><div class="row" style="justify-content:space-between"><b>${esc(s.name)}</b><span class="tag">${s.cat}</span></div><span class="mu" style="font-size:13px">${s.date} · ${s.res}</span></div></button>`;
function Ask(){const s=sc(A.scene);return`<div class="bar"><h2>Ask your image</h2><div class="row"><div class="seg"><button data-a="mode" data-m="simple" class="${A.mode=='simple'?'on':''}">Beginner</button><button data-a="mode" data-m="expert" class="${A.mode=='expert'?'on':''}">Expert</button></div><select class="inp" style="width:auto" data-a="pick">${SC.map(x=>`<option value="${x.id}" ${x.id==A.scene?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn g sm" data-a="up">${ic('up')}Upload</button><input type="file" id="fi" accept="image/*" hidden></div></div>
<div class="ask"><div class="card"><div class="chat" id="chat">${A.msgs.length?A.msgs.map((m,i)=>m.r=='u'?`<div class="m u">${esc(m.t)}</div>`:`<div class="m a">${esc(A.mode=='simple'?m.s:m.a)}<div class="conf"><span>Confidence ${m.c}%</span><button class="chip" data-a="save" data-i="${i}">${ic('mark')} Save</button></div></div>`).join(''):`<div class="empty">${ic('spark')}<br>Ask anything about this image, or tap a suggestion below.</div>`}${A.busy?'<div class="m a dots"><span></span><span></span><span></span></div>':''}</div>
<div class="row" style="margin:12px 0">${(s.I.length?s.I.map(x=>x.q):GEN).map(q=>`<button class="chip" data-a="chip" data-t="${esc(q)}">${esc(q)}</button>`).join('')}</div>
<form data-f="ask" class="row" style="flex-wrap:nowrap"><input class="inp" name="q" placeholder="e.g. Where is the water?" autocomplete="off"><button class="btn" ${A.busy?'disabled':''}>${ic('send')}</button></form><div class="err" data-e="q"></div></div>
<div class="card">${view(s,A.hl)}<div class="row" style="justify-content:space-between;margin-top:10px"><b>${esc(s.name)}</b><span class="mu" style="font-size:13px">${s.date} · ${s.res}</span></div><div class="note" style="margin-top:10px">Answers are generated by AI from the image itself. AI can make mistakes, so double-check important decisions.</div></div></div>`}
function Scenes(){return`<div class="bar"><h2>Scene library</h2></div><div class="row" style="margin-bottom:14px"><input class="inp" style="max-width:260px" data-in="sq" placeholder="Search scenes…" value="${esc(F.sq)}">${['All','Urban','Agriculture','Disaster','Forest'].map(c=>`<button class="chip ${F.cat==c?'on':''}" data-a="cat" data-c="${c}">${c}</button>`).join('')}</div><div class="grid g3" id="list">${sList()}</div>`}
const sList=()=>{const l=SC.filter(s=>(F.cat=='All'||s.cat==F.cat)&&s.name.toLowerCase().includes(F.sq.toLowerCase()));return l.length?l.map(sceneCard).join(''):'<div class="empty">No scenes match your search.</div>'};
const vList=()=>{const l=S.saved.map((x,i)=>[x,i]).filter(([x])=>(x.q+x.a).toLowerCase().includes(F.vq.toLowerCase()));return l.length?l.map(([x,i])=>`<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><span class="tag">${esc(sc(x.s).name)}</span><div class="row"><button class="btn g sm" data-a="copy" data-i="${i}">${ic('copy')}</button><button class="btn g sm" data-a="del" data-i="${i}">${ic('trash')}</button></div></div><p style="margin:10px 0 2px"><b>Q: ${esc(x.q)}</b></p><p class="mu" style="margin:0">${esc(x.a)}</p></div>`).join(''):`<div class="empty">${S.saved.length?'Nothing matches.':'No saved answers yet. Save one from the Ask page.'}</div>`};
const Saved=()=>`<div class="bar"><h2>Saved answers</h2></div><input class="inp" style="max-width:320px;margin-bottom:14px" data-in="vq" placeholder="Search saved…" value="${esc(F.vq)}"><div id="list">${vList()}</div>`;
const gList=()=>{const l=GL.filter(g=>(g[0]+g[1]).toLowerCase().includes(F.gq.toLowerCase()));return l.length?l.map(g=>`<details><summary>${g[0]}</summary><p class="mu" style="margin:8px 0 0">${g[1]}</p></details>`).join(''):'<div class="empty">No terms found.</div>'};
const Learn=()=>`<div class="bar"><h2>Learn the basics</h2></div><div class="card" style="margin-bottom:16px"><h3>Tips for good questions</h3><p class="mu">Ask about <b>what</b> (buildings, water, crops), <b>where</b>, <b>how many</b> or <b>how much</b>. Short, everyday words work best.</p><div class="row">${['Where is the water?','Which fields look healthy?','How much area is flooded?','Has any land been cleared?'].map(t=>`<button class="chip" data-a="try" data-t="${t}">${t}</button>`).join('')}</div></div><input class="inp" style="max-width:320px;margin-bottom:12px" data-in="gq" placeholder="Search glossary…" value="${esc(F.gq)}"><div id="list">${gList()}</div>`;
/* ---------- router ---------- */
function render(){const h=location.hash.slice(1)||'home',[p,v='dash']=h.split('/');let html;
if(p=='app'&&!S.user){toast('Please log in first','e');return go('login')}
if(p=='app'){const b={dash:Dash,ask:Ask,scenes:Scenes,saved:Saved,learn:Learn}[v]||Dash;html=Shell(v,b())}
else html=p=='login'?Auth('login'):p=='signup'?Auth('signup'):Landing();
$('#root').innerHTML=html;scrollTo(0,0);const c=$('#chat');if(c)c.scrollTop=c.scrollHeight}
addEventListener('hashchange',render);
const GEN=['Describe this image','What land cover types are visible?','Where is the water?','Are there buildings or roads?','Is there any sign of damage or change?'];
async function blobOf(s){if(s.blob)return s.blob;const im=new Image();await new Promise((a,b)=>{im.onload=a;im.onerror=b;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="800" height="520">${s.svg}</svg>`)});const c=document.createElement('canvas');c.width=800;c.height=520;c.getContext('2d').drawImage(im,0,0,800,520);return s.blob=await new Promise(r=>c.toBlob(r,'image/png'))}
async function smart(t,fb){const s=sc(A.scene);try{const sm=window.claude&&await claude.use('sample');if(!sm)throw{code:'na'};const L=sm.limits?await sm.limits():{images:true};if(!L.images)throw{code:'na'};
const p=`You are SatQuery AI, an expert in remote sensing and image analysis. Look carefully at the attached image (normally satellite or aerial). The user asks: "${t.replace(/"/g,"'")}"\nReply ONLY with JSON: {"simple":string,"expert":string,"conf":number,"boxes":[{"x":number,"y":number,"w":number,"h":number,"label":string}]}.\n- simple: 1-3 sentences in everyday words, no jargon, for a complete beginner.\n- expert: technical answer with rough estimates (counts, area percentages, likely land-cover classes or indices) and caveats.\n- conf: your honest confidence 0-100.\n- boxes: up to 5 regions relevant to the question, as fractions 0-1 of image width and height from the top-left corner; empty array if not localisable.\nBase everything only on what is visible. Do not invent precise numbers you cannot see; say when you are unsure. If the image is not a satellite or aerial image, say what it is and answer as best you can.`;
const r=await sm.json(p,{images:[await blobOf(s)],cache:false});const H=s.vh||260,n=v=>Math.min(1,Math.max(0,+v||0));const bx=(Array.isArray(r.boxes)?r.boxes:[]).slice(0,5).map(b=>[n(b.x)*400,n(b.y)*H,n(b.w)*400,n(b.h)*H,esc(String(b.label||'').slice(0,28))]);const si=String(r.simple||r.expert||''),ex=String(r.expert||r.simple||'');if(!si)throw{code:'bad'};
A.msgs.push({r:'a',a:ex,s:si,c:Math.round(Math.min(100,Math.max(0,+r.conf||60))),q:t});A.hl=bx;A.busy=false;S.q++;S.hist.unshift({q:t,s:A.scene});S.hist=S.hist.slice(0,20);save();render()}catch(e){const m=e&&e.code=='not_granted'?'AI access was not allowed. Please allow it to analyse images.':e&&e.code=='rate_limited'?'Too many requests. Please wait a moment and try again.':'The AI could not analyse this image right now. Please try again.';if(s.id[0]=='u'||!fb){A.msgs.pop();A.busy=false;toast(m,'e');render()}else{toast('AI unavailable. Showing a sample answer.','e');fb()}}}
function upload(f){if(!f.type.startsWith('image/'))return toast('Please choose an image file','e');if(f.size>25e6)return toast('Image is too large (max 25 MB)','e');const u=URL.createObjectURL(f),im=new Image();im.onerror=()=>toast('Could not read this image','e');im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>{if(!b)return toast('Could not process image','e');const id='u'+Date.now(),vh=Math.round(400*h/w),d=c.toDataURL('image/jpeg',.85);SC.unshift({id,name:f.name.slice(0,28),cat:'Uploaded',date:'Your image',res:'unknown',vh,blob:b,svg:`<image href="${d}" width="400" height="${vh}"/>`,desc:['',''],I:[]});A={scene:id,msgs:[],mode:A.mode,busy:false,hl:[]};toast('Image added. Analysing…','s');render();setTimeout(()=>ask('Describe this image'),50)},'image/jpeg',.85)};im.src=u}
function ask(t){t=t.trim();const e=$('[data-e=q]');if(t.length<3){if(e)e.textContent='Please type a question (at least 3 characters).';return toast('Question is too short','e')}
if(A.busy)return;A.msgs.push({r:'u',t});A.busy=true;A.hl=[];render();
smart(t,()=>{const s=sc(A.scene),m=s.I.find(x=>x.k.test(t));const x=m||s.I[s.I.length-1];
A.msgs.push({r:'a',a:(m?'':'I wasn’t sure about that, so here’s an overview. ')+x.a,s:(m?'':'I wasn’t sure about that, so here’s an overview. ')+x.s,c:m?x.c:55,q:t});A.hl=x.b;A.busy=false;S.q++;S.hist.unshift({q:t,s:A.scene});S.hist=S.hist.slice(0,20);save();render()},900)}
function login(n){S.user={name:n};save();toast('Welcome to SatQuery AI','s');go('app/dash')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
if(a=='theme'){S.dark=!S.dark;document.documentElement.dataset.theme=S.dark?'dark':'light';save();render()}
else if(a=='logout'){S.user=null;save();toast('Logged out');go('home')}
else if(a=='demo')login('Demo User');
else if(a=='scene'){A={scene:el.dataset.id,msgs:[],mode:A.mode,busy:false,hl:[]};go('app/ask');if(location.hash=='#app/ask')render()}
else if(a=='chip'||a=='try'){if(a=='try'){A.scene=SC.find(s=>s.I.some(i=>i.q==el.dataset.t))?.id||A.scene;A.msgs=[];go('app/ask')}setTimeout(()=>ask(el.dataset.t),30)}
else if(a=='mode'){A.mode=el.dataset.m;render()}
else if(a=='cat'){F.cat=el.dataset.c;render()}
else if(a=='save'){const m=A.msgs[+el.dataset.i];if(S.saved.some(x=>x.q==m.q&&x.s==A.scene))return toast('Already saved');S.saved.unshift({q:m.q,a:m.a,s:A.scene});save();toast('Answer saved','s')}
else if(a=='del'){S.saved.splice(+el.dataset.i,1);save();toast('Removed');render()}
else if(a=='copy'){const x=S.saved[+el.dataset.i];try{navigator.clipboard.writeText(`Q: ${x.q}\nA: ${x.a}`).then(()=>toast('Copied','s'),()=>toast('Copy blocked by browser','e'))}catch(_){toast('Copy not available','e')}}
else if(a=='up')$('#fi').click()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a=='pick'){A={scene:t.value,msgs:[],mode:A.mode,busy:false,hl:[]};render()}
if(t.id=='fi'&&t.files[0]){return upload(t.files[0]);const f=t.files[0];if(!f.type.startsWith('image/'))return toast('Please choose an image file','e');const r=new FileReader();r.onload=()=>{const id='u'+Date.now();SC.unshift({id,name:f.name.slice(0,28),cat:'Urban',date:'Uploaded',res:'unknown',svg:`<image href="${r.result}" width="400" height="260" preserveAspectRatio="xMidYMid slice"/>`,desc:['Uploaded image. The prototype gives generic answers for custom uploads.','This is your own picture. In the full product I would analyse it for you.'],I:[]});SC[0].I.push(I('Describe this image',/./,SC[0].desc[0],SC[0].desc[1],[],60));A={scene:id,msgs:[],mode:A.mode,busy:false,hl:[]};toast('Image added (demo analysis)','s');render()};r.onerror=()=>toast('Could not read file','e');r.readAsDataURL(f)}});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;F[k]=e.target.value;const L=$('#list');L.innerHTML=k=='sq'?sList():k=='vq'?vList():gList()});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
if(f=='ask'){ask(d.q||'');return}
const er={};if(f=='signup'&&(!d.n||d.n.trim().length<2))er.n='Enter your name.';if(!/^\S+@\S+\.\S+$/.test(d.e||''))er.e='Enter a valid email address.';if((d.p||'').length<6)er.p='Password must be at least 6 characters.';
document.querySelectorAll('[data-e]').forEach(x=>x.textContent=er[x.dataset.e]||'');if(Object.keys(er).length)return toast('Please fix the highlighted fields','e');
login(f=='signup'?d.n.trim():d.e.split('@')[0])});
render();
</script></body></html>
